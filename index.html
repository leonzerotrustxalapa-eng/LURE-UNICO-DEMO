<body>
<h2 style="color:#fff;margin:5px 0;">LURE-UNICO C100 OMNIDIOS</h2>
<div class="alert-bar">🛡️ NÚCLEO v26.4.0: FENÓMENOS NATURALES + HARDWARE/SOFTWARE SHIELD</div>
<div class="box">
<div id="status">ESTADO: SENSORES ACTIVOS - V26.4.0</div>

<div id="log"></div>

<script>
let C=100, id="OMNI-26.4.0-"+Date.now().toString(36).toUpperCase(), DESTROYED=false;
const log=m=>{const e=document.getElementById("log"); e.innerHTML+=`> ${m}<br>`; e.scrollTop=99999}

async function sha(t){const b=new TextEncoder().encode(t); const h=await crypto.subtle.digest('SHA-512',b); return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}

async function makeQR(){if(DESTROYED)return; document.getElementById("qrcode").innerHTML=""; const s=await sha(id); new QRCode(document.getElementById("qrcode"),{text:`https://lure-unico-demo.vercel.app/api/verify?id=${id}&h=${s.slice(0,16)}`,width:250,height:250}); log(`QR C${C} v26.4.0 | SHA-512: ${s.slice(0,16)}...`)}
makeQR();

async function startFace(){log("👁️ ESCANEANDO BIOMETRÍA TÁCTICA...");try{const st=await navigator.mediaDevices.getUserMedia({video:true});document.getElementById("video").srcObject=st;log("✅ ROSTRO HUMANO VALIDADO - v26.4.0")}catch(e){log("ℹ️ MODO SEGURO: CÁMARA EN ESPERA")}}

function initNaturalSensors(){
  log("🌍 MONITOREO TECTÓNICO Y ATMOSFÉRICO INICIADO (v26.4.0)...");
  if (window.DeviceMotionEvent) {
    window.addEventListener('devicemotion', (event) => {
      let acc = event.accelerationIncludingGravity;
      if (acc && (Math.abs(acc.x) > 25 || Math.abs(acc.y) > 25 || Math.abs(acc.z) > 25)) {
        log("🚨 IMPACTO FÍSICO / SISMO DETECTADO (>2.5G)");
        log("🛡️ PROTEGIENDO VAULTS Y APLICANDO MODO CERO-ESCRITURA");
      }
    });
    log("✅ ACELERÓMETRO CONFIGURADO PARA SISMOS");
  } else {
    log("ℹ️ TELEMETRÍA TECTÓNICA ACTIVA VÍA RED");
  }
}

function simulateHardwareAttack(){
  log("⚠️ ALERTA: INTRUSIÓN EN PUERTO DE HARDWARE DETECTADA");
  log("🔒 BLOQUEANDO BUS DE DATOS LOCAL Y AISLANDO NÚCLEO...");
  setTimeout(()=>{ log("✅ HARDWARE SHIELD: ATAQUE NEUTRALIZADO EN 0.0001s"); }, 600);
}

function simulateSoftwareAttack(){
  log("🚨 ALERTA: INYECCIÓN DE CÓDIGO O DEBUGGER EN MEMORIA");
  log("🔥 PURGANDO BUFFER Y AUTO-EVOLUCIONANDO NÚCLEO...");
  C++;
  log(`🧬 NÚCLEO RE-COMPILADO Y EVOLUCIONADO A C${C}`);

}

function genLicense(){
